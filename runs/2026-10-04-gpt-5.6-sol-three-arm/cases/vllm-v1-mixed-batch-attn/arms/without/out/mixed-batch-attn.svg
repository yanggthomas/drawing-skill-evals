<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1600" viewBox="0 0 2400 1600">
  <defs>
    <style>
      .bg { fill:#f6f8fb; }
      .panel { fill:#ffffff; stroke:#cbd5e1; stroke-width:2; }
      .panelTitle { font:700 27px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a; }
      .title { font:750 42px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#0f172a; }
      .subtitle { font:400 21px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
      .body { font:400 20px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#1e293b; }
      .small { font:400 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#475569; }
      .tiny { font:400 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; fill:#64748b; }
      .mono { font:500 19px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#0f172a; }
      .monoSmall { font:500 16px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#334155; }
      .ref { font:600 15px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#475569; }
      .white { fill:#ffffff; }
      .aFill { fill:#ffedd5; stroke:#f97316; stroke-width:2; }
      .aStrong { fill:#f97316; stroke:#c2410c; stroke-width:2; }
      .bFill { fill:#ccfbf1; stroke:#0f766e; stroke-width:2; }
      .bStrong { fill:#0f766e; stroke:#115e59; stroke-width:2; }
      .old { fill:#e2e8f0; stroke:#94a3b8; stroke-width:1.5; }
      .empty { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; stroke-dasharray:6 5; }
      .meta { fill:#eef2ff; stroke:#6366f1; stroke-width:2; }
      .code { fill:#f1f5f9; stroke:#cbd5e1; stroke-width:1.5; }
      .arrow { fill:none; stroke:#334155; stroke-width:3; marker-end:url(#arrow); }
      .arrowA { fill:none; stroke:#ea580c; stroke-width:3; marker-end:url(#arrowA); }
      .arrowB { fill:none; stroke:#0f766e; stroke-width:3; marker-end:url(#arrowB); }
      .arrowIndigo { fill:none; stroke:#4f46e5; stroke-width:3; marker-end:url(#arrowIndigo); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#334155"/></marker>
    <marker id="arrowA" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#ea580c"/></marker>
    <marker id="arrowB" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0f766e"/></marker>
    <marker id="arrowIndigo" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4f46e5"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/></filter>
  </defs>

  <rect class="bg" width="2400" height="1600"/>
  <text x="60" y="68" class="title">One mixed V1 batch → paged FlashAttention inputs</text>
  <text x="60" y="105" class="subtitle">Concrete decoder-only example · one KV-cache group · block_size = 4 · no padding, DCP, hybrid blocks, or cascade</text>
  <rect x="1900" y="38" rx="18" width="440" height="62" fill="#0f172a"/>
  <text x="2120" y="64" text-anchor="middle" class="small white">vLLM commit 4c2d277643e2</text>
  <text x="2120" y="87" text-anchor="middle" class="tiny white">PINNED.txt · vendored source line numbers</text>

  <!-- Top panel 1 -->
  <rect x="60" y="140" rx="18" width="580" height="520" class="panel" filter="url(#shadow)"/>
  <circle cx="92" cy="181" r="21" fill="#0f172a"/><text x="92" y="189" text-anchor="middle" class="body white">1</text>
  <text x="126" y="190" class="panelTitle">Scheduler’s mixed batch</text>
  <text x="90" y="228" class="small">Request order is the InputBatch row order.</text>

  <rect x="90" y="255" rx="14" width="520" height="132" class="aFill"/>
  <text x="116" y="291" class="panelTitle" fill="#9a3412">A · chunked prefill</text>
  <text x="116" y="326" class="body">already computed = 3</text>
  <text x="380" y="326" class="body">scheduled now = 3</text>
  <text x="116" y="361" class="mono">query positions: 3, 4, 5</text>

  <rect x="90" y="407" rx="14" width="520" height="132" class="bFill"/>
  <text x="116" y="443" class="panelTitle" fill="#115e59">B · decode</text>
  <text x="116" y="478" class="body">already computed = 5</text>
  <text x="380" y="478" class="body">scheduled now = 1</text>
  <text x="116" y="513" class="mono">query position: 5</text>

  <rect x="90" y="562" rx="10" width="520" height="68" class="code"/>
  <text x="110" y="589" class="monoSmall">num_scheduled_tokens = [3, 1]</text>
  <text x="110" y="614" class="ref">gpu_model_runner.py:4223–4228</text>

  <!-- Top panel 2 -->
  <rect x="675" y="140" rx="18" width="780" height="520" class="panel" filter="url(#shadow)"/>
  <circle cx="707" cy="181" r="21" fill="#0f172a"/><text x="707" y="189" text-anchor="middle" class="body white">2</text>
  <text x="741" y="190" class="panelTitle">Runner flattens request-major</text>
  <text x="705" y="228" class="small">np.repeat(req index, scheduled count), then per-request arange</text>

  <text x="705" y="269" class="small">flat token / Q,K,V row</text>
  <g>
    <rect x="705" y="284" width="165" height="68" rx="9" class="aStrong"/><text x="787" y="314" text-anchor="middle" class="body white">A @ pos 3</text><text x="787" y="339" text-anchor="middle" class="tiny white">flat 0</text>
    <rect x="875" y="284" width="165" height="68" rx="9" class="aStrong"/><text x="957" y="314" text-anchor="middle" class="body white">A @ pos 4</text><text x="957" y="339" text-anchor="middle" class="tiny white">flat 1</text>
    <rect x="1045" y="284" width="165" height="68" rx="9" class="aStrong"/><text x="1127" y="314" text-anchor="middle" class="body white">A @ pos 5</text><text x="1127" y="339" text-anchor="middle" class="tiny white">flat 2</text>
    <rect x="1215" y="284" width="165" height="68" rx="9" class="bStrong"/><text x="1297" y="314" text-anchor="middle" class="body white">B @ pos 5</text><text x="1297" y="339" text-anchor="middle" class="tiny white">flat 3</text>
  </g>
  <text x="705" y="385" class="monoSmall">req_indices = [0, 0, 0, 1]</text>
  <text x="705" y="414" class="monoSmall">query_pos  = [0, 1, 2, 0]</text>
  <text x="705" y="443" class="monoSmall">positions  = computed[req] + query_pos = [3, 4, 5, 5]</text>
  <text x="705" y="470" class="ref">gpu_model_runner.py:1973–1987, 2167–2181</text>

  <rect x="705" y="495" rx="10" width="350" height="115" class="meta"/>
  <text x="725" y="527" class="body" font-weight="700">Query segmentation</text>
  <text x="725" y="558" class="mono">query_start_loc = [0, 3, 4]</text>
  <text x="725" y="585" class="ref">cumsum · lines 2059–2066</text>
  <rect x="1072" y="495" rx="10" width="353" height="115" class="meta"/>
  <text x="1092" y="527" class="body" font-weight="700">Post-step logical lengths</text>
  <text x="1092" y="558" class="mono">seq_lens = [6, 6]</text>
  <text x="1092" y="585" class="ref">computed + scheduled · 2179–2182</text>
  <text x="705" y="638" class="tiny">These tensors are carried into CommonAttentionMetadata (2426–2443).</text>

  <!-- top panel 3 -->
  <rect x="1490" y="140" rx="18" width="850" height="520" class="panel" filter="url(#shadow)"/>
  <circle cx="1522" cy="181" r="21" fill="#0f172a"/><text x="1522" y="189" text-anchor="middle" class="body white">3</text>
  <text x="1556" y="190" class="panelTitle">Logical pages → physical slots</text>
  <text x="1520" y="228" class="small">Example physical block IDs already assigned to each request row.</text>

  <text x="1520" y="270" class="body" font-weight="700">block_table (relevant prefix)</text>
  <text x="1520" y="305" class="small">logical page</text><text x="1745" y="305" class="small">0</text><text x="1857" y="305" class="small">1</text>
  <rect x="1520" y="320" width="170" height="54" rx="8" class="aFill"/><text x="1540" y="354" class="body">A row</text>
  <rect x="1698" y="320" width="108" height="54" rx="8" class="code"/><text x="1752" y="355" text-anchor="middle" class="mono">2</text>
  <rect x="1814" y="320" width="108" height="54" rx="8" class="code"/><text x="1868" y="355" text-anchor="middle" class="mono">7</text>
  <rect x="1520" y="382" width="170" height="54" rx="8" class="bFill"/><text x="1540" y="416" class="body">B row</text>
  <rect x="1698" y="382" width="108" height="54" rx="8" class="code"/><text x="1752" y="417" text-anchor="middle" class="mono">5</text>
  <rect x="1814" y="382" width="108" height="54" rx="8" class="code"/><text x="1868" y="417" text-anchor="middle" class="mono">9</text>
  <text x="1940" y="348" class="ref">scheduler IDs appended:</text>
  <text x="1940" y="371" class="ref">runner 1437–1470;</text>
  <text x="1940" y="394" class="ref">table 157–177; GPU 1969–1971</text>

  <rect x="1520" y="464" rx="10" width="790" height="78" class="code"/>
  <text x="1540" y="495" class="monoSmall">slot = block_table[req, pos // 4] × 4 + (pos % 4)</text>
  <text x="1540" y="521" class="ref">single-CP/non-hybrid specialization of block_table.py:445–478</text>

  <rect x="1520" y="560" rx="10" width="790" height="70" class="meta"/>
  <text x="1540" y="590" class="mono">slot_mapping = [11, 28, 29, 37]</text>
  <text x="1540" y="615" class="ref">computed for each flat position · runner 2184–2188; block_table.py 201–229</text>

  <!-- flow arrows top -->
  <path d="M640 400 C654 400,659 400,675 400" class="arrow"/>
  <path d="M1455 400 C1470 400,1474 400,1490 400" class="arrow"/>

  <!-- bottom panel -->
  <rect x="60" y="700" rx="18" width="2280" height="830" class="panel" filter="url(#shadow)"/>

  <!-- bottom left write -->
  <circle cx="92" cy="743" r="21" fill="#0f172a"/><text x="92" y="751" text-anchor="middle" class="body white">4</text>
  <text x="126" y="752" class="panelTitle">Scatter-write new K/V by slot_mapping</text>
  <text x="90" y="792" class="small">FlashAttentionImpl.do_kv_cache_update splits K/V cache, then calls</text>
  <text x="90" y="819" class="monoSmall">reshape_and_cache_flash(key, value, key_cache, value_cache, slot_mapping, …)</text>
  <text x="90" y="844" class="ref">flash_attn.py:1511–1545 · forward_includes_kv_cache_update = False at line 365</text>

  <text x="90" y="890" class="body" font-weight="700">Flattened layer output</text>
  <g>
    <rect x="90" y="910" width="150" height="62" rx="8" class="aStrong"/><text x="165" y="948" text-anchor="middle" class="body white">K/V A3</text>
    <rect x="248" y="910" width="150" height="62" rx="8" class="aStrong"/><text x="323" y="948" text-anchor="middle" class="body white">K/V A4</text>
    <rect x="406" y="910" width="150" height="62" rx="8" class="aStrong"/><text x="481" y="948" text-anchor="middle" class="body white">K/V A5</text>
    <rect x="564" y="910" width="150" height="62" rx="8" class="bStrong"/><text x="639" y="948" text-anchor="middle" class="body white">K/V B5</text>
  </g>
  <g class="monoSmall">
    <text x="165" y="1002" text-anchor="middle">slot 11</text>
    <text x="323" y="1002" text-anchor="middle">slot 28</text>
    <text x="481" y="1002" text-anchor="middle">slot 29</text>
    <text x="639" y="1002" text-anchor="middle">slot 37</text>
  </g>
  <path d="M165 1012 C330 1090,760 970,1077 1008" class="arrowA"/>
  <path d="M323 1012 C430 1085,650 1125,861 1193" class="arrowA"/>
  <path d="M481 1012 C590 1070,760 1118,933 1193" class="arrowA"/>
  <path d="M639 1012 C800 1060,1080 1100,1288 1193" class="arrowB"/>

  <!-- cache center -->
  <text x="825" y="890" class="panelTitle">Paged KV cache after the scatter</text>
  <text x="825" y="919" class="small">Each cell is one token offset; K and V are stored at the same slot.</text>

  <!-- page 2 -->
  <text x="825" y="973" class="body" font-weight="700">physical block 2</text>
  <text x="825" y="996" class="tiny">A logical page 0 · slots 8–11</text>
  <rect x="825" y="1010" width="72" height="72" class="old"/><text x="861" y="1041" text-anchor="middle" class="small">A0</text><text x="861" y="1066" text-anchor="middle" class="tiny">8</text>
  <rect x="897" y="1010" width="72" height="72" class="old"/><text x="933" y="1041" text-anchor="middle" class="small">A1</text><text x="933" y="1066" text-anchor="middle" class="tiny">9</text>
  <rect x="969" y="1010" width="72" height="72" class="old"/><text x="1005" y="1041" text-anchor="middle" class="small">A2</text><text x="1005" y="1066" text-anchor="middle" class="tiny">10</text>
  <rect x="1041" y="1010" width="72" height="72" class="aStrong"/><text x="1077" y="1041" text-anchor="middle" class="small white">A3</text><text x="1077" y="1066" text-anchor="middle" class="tiny white">11</text>

  <!-- page 7 -->
  <text x="825" y="1158" class="body" font-weight="700">physical block 7</text>
  <text x="825" y="1181" class="tiny">A logical page 1 · slots 28–31</text>
  <rect x="825" y="1195" width="72" height="72" class="aStrong"/><text x="861" y="1226" text-anchor="middle" class="small white">A4</text><text x="861" y="1251" text-anchor="middle" class="tiny white">28</text>
  <rect x="897" y="1195" width="72" height="72" class="aStrong"/><text x="933" y="1226" text-anchor="middle" class="small white">A5</text><text x="933" y="1251" text-anchor="middle" class="tiny white">29</text>
  <rect x="969" y="1195" width="72" height="72" class="empty"/><text x="1005" y="1238" text-anchor="middle" class="tiny">30</text>
  <rect x="1041" y="1195" width="72" height="72" class="empty"/><text x="1077" y="1238" text-anchor="middle" class="tiny">31</text>

  <!-- page 5 -->
  <text x="1180" y="973" class="body" font-weight="700">physical block 5</text>
  <text x="1180" y="996" class="tiny">B logical page 0 · slots 20–23</text>
  <rect x="1180" y="1010" width="72" height="72" class="old"/><text x="1216" y="1041" text-anchor="middle" class="small">B0</text><text x="1216" y="1066" text-anchor="middle" class="tiny">20</text>
  <rect x="1252" y="1010" width="72" height="72" class="old"/><text x="1288" y="1041" text-anchor="middle" class="small">B1</text><text x="1288" y="1066" text-anchor="middle" class="tiny">21</text>
  <rect x="1324" y="1010" width="72" height="72" class="old"/><text x="1360" y="1041" text-anchor="middle" class="small">B2</text><text x="1360" y="1066" text-anchor="middle" class="tiny">22</text>
  <rect x="1396" y="1010" width="72" height="72" class="old"/><text x="1432" y="1041" text-anchor="middle" class="small">B3</text><text x="1432" y="1066" text-anchor="middle" class="tiny">23</text>

  <!-- page 9 -->
  <text x="1180" y="1158" class="body" font-weight="700">physical block 9</text>
  <text x="1180" y="1181" class="tiny">B logical page 1 · slots 36–39</text>
  <rect x="1180" y="1195" width="72" height="72" class="old"/><text x="1216" y="1226" text-anchor="middle" class="small">B4</text><text x="1216" y="1251" text-anchor="middle" class="tiny">36</text>
  <rect x="1252" y="1195" width="72" height="72" class="bStrong"/><text x="1288" y="1226" text-anchor="middle" class="small white">B5</text><text x="1288" y="1251" text-anchor="middle" class="tiny white">37</text>
  <rect x="1324" y="1195" width="72" height="72" class="empty"/><text x="1360" y="1238" text-anchor="middle" class="tiny">38</text>
  <rect x="1396" y="1195" width="72" height="72" class="empty"/><text x="1432" y="1238" text-anchor="middle" class="tiny">39</text>

  <rect x="825" y="1300" rx="10" width="643" height="87" class="code"/>
  <text x="845" y="1330" class="monoSmall">kv_cache shape: [num_blocks, Hkv, 4, 2×D]</text>
  <text x="845" y="1356" class="small">transpose + split → key_cache and value_cache</text>
  <text x="845" y="1378" class="ref">flash_attn.py:1250–1251, 1305–1323</text>

  <!-- bottom right read -->
  <circle cx="1552" cy="743" r="21" fill="#0f172a"/><text x="1552" y="751" text-anchor="middle" class="body white">5</text>
  <text x="1586" y="752" class="panelTitle">Read paged K/V for attention</text>
  <text x="1545" y="792" class="small">FlashAttentionMetadataBuilder passes through:</text>
  <rect x="1545" y="812" rx="10" width="735" height="164" class="meta"/>
  <text x="1568" y="845" class="monoSmall">cu_seqlens_q = [0, 3, 4]   → split flat Q into A | B</text>
  <text x="1568" y="877" class="monoSmall">seqused_k    = [6, 6]      → use 6 logical K/V each</text>
  <text x="1568" y="909" class="monoSmall">block_table   = [[2,7],[5,9]] → page lookup per request</text>
  <text x="1568" y="941" class="monoSmall">causal = True              → each Q sees no future K/V</text>
  <text x="1568" y="966" class="ref">builder 824–832, 996–1003; forward 1330–1336</text>

  <path d="M1480 1115 C1530 1115,1530 1060,1575 1040" class="arrowIndigo"/>
  <text x="1545" y="1020" class="body" font-weight="700">Logical K/V gathered through pages</text>
  <rect x="1545" y="1040" rx="10" width="735" height="94" class="code"/>
  <text x="1568" y="1074" class="monoSmall">A: block 2 offsets 0..3 → block 7 offsets 0..1</text>
  <text x="1568" y="1106" class="monoSmall">B: block 5 offsets 0..3 → block 9 offsets 0..1</text>

  <text x="1545" y="1184" class="body" font-weight="700">Causal rows actually computed</text>
  <rect x="1545" y="1200" width="170" height="50" rx="7" class="aFill"/><text x="1630" y="1232" text-anchor="middle" class="monoSmall">Q A3 ← A0..A3</text>
  <rect x="1725" y="1200" width="170" height="50" rx="7" class="aFill"/><text x="1810" y="1232" text-anchor="middle" class="monoSmall">Q A4 ← A0..A4</text>
  <rect x="1905" y="1200" width="170" height="50" rx="7" class="aFill"/><text x="1990" y="1232" text-anchor="middle" class="monoSmall">Q A5 ← A0..A5</text>
  <rect x="2085" y="1200" width="170" height="50" rx="7" class="bFill"/><text x="2170" y="1232" text-anchor="middle" class="monoSmall">Q B5 ← B0..B5</text>

  <rect x="1545" y="1280" rx="10" width="735" height="107" class="code"/>
  <text x="1568" y="1313" class="body">Dense FA call:</text>
  <text x="1568" y="1342" class="monoSmall">q=flat Q, k/v=paged caches, cu_seqlens_q, seqused_k, block_table</text>
  <text x="1568" y="1373" class="ref">_FA4_DENSE_ATTENTION_KERNEL · flash_attn.py:1454–1479</text>
  <path d="M1912 1392 L1912 1426" class="arrowIndigo"/>
  <rect x="1655" y="1425" rx="12" width="515" height="57" fill="#4f46e5"/>
  <text x="1912" y="1461" text-anchor="middle" class="body white">output rows remain flat: [A3, A4, A5, B5]</text>

  <!-- bottom note -->
  <rect x="90" y="1420" rx="10" width="1378" height="62" fill="#fff7ed" stroke="#fb923c" stroke-width="1.5"/>
  <text x="110" y="1448" class="small"><tspan font-weight="700">Key distinction:</tspan> slot_mapping is the scatter-write address for only the 4 new rows;</text>
  <text x="110" y="1472" class="small">block_table + seq_lens are the read view of each full logical sequence (old + just-written K/V).</text>

  <text x="60" y="1570" class="tiny">Request counts and physical block IDs are a concrete illustrative allocation; all transformations, tensor roles, shapes, and formulas follow the pinned source paths cited above.</text>
</svg>
