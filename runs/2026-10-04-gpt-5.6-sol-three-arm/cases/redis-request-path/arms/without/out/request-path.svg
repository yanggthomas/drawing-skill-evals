<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1700" viewBox="0 0 2200 1700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#101b31"/>
    </linearGradient>
    <linearGradient id="mainHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="ioHead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity="0.5"/>
    </filter>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c084fc"/>
    </marker>
    <style>
      .sans { font-family: Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, monospace; }
      .title { font-size: 48px; font-weight: 750; fill: #f8fafc; }
      .subtitle { font-size: 21px; fill: #9fb0c8; }
      .laneTitle { font-size: 25px; font-weight: 750; fill: #07111f; }
      .laneSub { font-size: 17px; fill: #bfd0e6; }
      .stepNo { font-size: 20px; font-weight: 800; fill: #07111f; text-anchor: middle; dominant-baseline: middle; }
      .cardTitle { font-size: 23px; font-weight: 750; fill: #f8fafc; }
      .body { font-size: 18px; fill: #d5deeb; }
      .code { font-size: 15px; fill: #8fa4bf; }
      .arrowLabel { font-size: 17px; font-weight: 700; fill: #d8b4fe; text-anchor: middle; }
      .networkLabel { font-size: 18px; font-weight: 750; fill: #6ee7b7; text-anchor: middle; }
      .small { font-size: 15px; fill: #a9b8cc; }
      .footer { font-size: 15px; fill: #8194ad; }
    </style>
  </defs>

  <rect width="2200" height="1700" fill="url(#bg)"/>
  <circle cx="2030" cy="95" r="250" fill="#0e7490" opacity="0.08"/>
  <circle cx="120" cy="1580" r="310" fill="#7c3aed" opacity="0.07"/>

  <text x="85" y="78" class="sans title">One Redis 8 request with I/O threads enabled</text>
  <text x="85" y="116" class="sans subtitle">Redis 8.10.2 · commit 498ecd0 · ordinary eligible client · time flows downward</text>

  <!-- lane backgrounds -->
  <rect x="70" y="155" width="330" height="1410" rx="26" fill="#0b1728" stroke="#28405e" stroke-width="2"/>
  <rect x="440" y="155" width="780" height="1410" rx="26" fill="#111a29" stroke="#6b4b21" stroke-width="2"/>
  <rect x="1260" y="155" width="870" height="1410" rx="26" fill="#0c1b2d" stroke="#1d607b" stroke-width="2"/>

  <!-- headers -->
  <rect x="70" y="155" width="330" height="86" rx="26" fill="#34d399"/>
  <path d="M70 215 h330 v26 H70z" fill="#34d399"/>
  <text x="235" y="192" class="sans laneTitle" text-anchor="middle">CLIENT</text>
  <text x="235" y="220" class="sans" font-size="16" fill="#064e3b" text-anchor="middle">TCP / TLS peer</text>

  <rect x="440" y="155" width="780" height="86" rx="26" fill="url(#mainHead)"/>
  <path d="M440 215 h780 v26 H440z" fill="#fb7185"/>
  <text x="830" y="192" class="sans laneTitle" text-anchor="middle">MAIN THREAD · event loop server.el</text>
  <text x="830" y="220" class="sans" font-size="16" fill="#5f2604" text-anchor="middle">accepts connections · owns dataset · executes commands</text>

  <rect x="1260" y="155" width="870" height="86" rx="26" fill="url(#ioHead)"/>
  <path d="M1260 215 h870 v26 H1260z" fill="#60a5fa"/>
  <text x="1695" y="192" class="sans laneTitle" text-anchor="middle">SELECTED I/O THREAD t · event loop t→el</text>
  <text x="1695" y="220" class="sans" font-size="16" fill="#073b5c" text-anchor="middle">owns this client’s socket between commands · reads / parses / writes</text>

  <!-- lifelines -->
  <line x1="235" y1="260" x2="235" y2="1515" stroke="#34d399" stroke-width="3" stroke-dasharray="8 12" opacity="0.45"/>
  <line x1="830" y1="260" x2="830" y2="1515" stroke="#fb923c" stroke-width="3" stroke-dasharray="8 12" opacity="0.45"/>
  <line x1="1695" y1="260" x2="1695" y2="1515" stroke="#22d3ee" stroke-width="3" stroke-dasharray="8 12" opacity="0.45"/>

  <!-- 1 accept -->
  <line x1="250" y1="312" x2="482" y2="312" stroke="#34d399" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <text x="364" y="295" class="sans networkLabel">connect</text>
  <g filter="url(#shadow)">
    <rect x="485" y="266" width="690" height="128" rx="18" fill="#1d2533" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <circle cx="520" cy="300" r="20" fill="#f59e0b"/>
  <text x="520" y="301" class="sans stepNo">1</text>
  <text x="552" y="306" class="sans cardTitle">Accept + create the client on the main thread</text>
  <text x="520" y="339" class="sans body">The listener’s readable handler is registered on <tspan class="mono">server.el</tspan>.</text>
  <text x="520" y="367" class="mono code">server.c:2833–2845 · networking.c:1666–1739</text>

  <!-- Initial handoff -->
  <g filter="url(#shadow)">
    <rect x="520" y="423" width="610" height="126" rx="18" fill="#221b31" stroke="#a855f7" stroke-width="2"/>
  </g>
  <circle cx="555" cy="457" r="20" fill="#c084fc"/>
  <text x="555" y="458" class="sans stepNo">2</text>
  <text x="588" y="463" class="sans cardTitle">Choose the least-loaded I/O thread</text>
  <text x="555" y="496" class="sans body"><tspan class="mono">c→tid = t→id</tspan>; unbind from <tspan class="mono">server.el</tspan>; queue client.</text>
  <text x="555" y="524" class="mono code">networking.c:1657–1663 · iothread.c:332–360</text>

  <line x1="1130" y1="487" x2="1308" y2="487" stroke="#c084fc" stroke-width="5" marker-end="url(#arrowPurple)"/>
  <text x="1215" y="464" class="sans arrowLabel">client* + notifier</text>
  <text x="1215" y="512" class="mono" font-size="13" fill="#a78bfa" text-anchor="middle">main pending → t pending</text>

  <g filter="url(#shadow)">
    <rect x="1310" y="423" width="775" height="126" rx="18" fill="#12283a" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <text x="1343" y="463" class="sans cardTitle">Bind the connection to <tspan class="mono">t→el</tspan></text>
  <text x="1343" y="496" class="sans body">Enable I/O; install <tspan class="mono">readQueryFromClient</tspan> as read handler.</text>
  <text x="1343" y="524" class="mono code">server.c:2103–2111 · iothread.c:503–515, 754–816</text>

  <!-- request -->
  <line x1="250" y1="614" x2="1310" y2="614" stroke="#34d399" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <rect x="620" y="585" width="324" height="38" rx="19" fill="#0b3a33" stroke="#34d399"/>
  <text x="782" y="611" class="sans networkLabel">RESP request bytes</text>

  <!-- read parse -->
  <g filter="url(#shadow)">
    <rect x="1310" y="652" width="775" height="176" rx="18" fill="#12283a" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <circle cx="1346" cy="686" r="20" fill="#22d3ee"/>
  <text x="1346" y="687" class="sans stepNo">3</text>
  <text x="1378" y="692" class="sans cardTitle">Read from the socket and parse RESP</text>
  <text x="1346" y="728" class="sans body"><tspan class="mono">readQueryFromClient</tspan> → <tspan class="mono">clientConnRead</tspan></text>
  <text x="1346" y="758" class="sans body"><tspan class="mono">processInputBuffer</tspan> parses inline / multibulk and preprocesses.</text>
  <text x="1346" y="790" class="sans body">A complete command is flagged; it is <tspan font-weight="750">not executed here</tspan>.</text>
  <text x="1346" y="815" class="mono code">networking.c:3893–4045, 3690–3785, 3840–3846</text>

  <!-- IO to main handoff -->
  <g filter="url(#shadow)">
    <rect x="1310" y="862" width="775" height="126" rx="18" fill="#221b31" stroke="#a855f7" stroke-width="2"/>
  </g>
  <circle cx="1346" cy="897" r="20" fill="#c084fc"/>
  <text x="1346" y="898" class="sans stepNo">4</text>
  <text x="1378" y="903" class="sans cardTitle">Hand the client to the main thread</text>
  <text x="1346" y="936" class="sans body">Disable read/write flags; move the list node; notify <tspan class="mono">server.el</tspan>.</text>
  <text x="1346" y="964" class="mono code">iothread.c:31–48, 112–137, 717–731, 879–881</text>

  <line x1="1310" y1="925" x2="1170" y2="925" stroke="#c084fc" stroke-width="5" marker-end="url(#arrowPurple)"/>
  <text x="1238" y="902" class="sans arrowLabel">client* + notifier</text>
  <text x="1238" y="950" class="mono" font-size="13" fill="#a78bfa" text-anchor="middle">t pending → main pending</text>

  <!-- execute -->
  <g filter="url(#shadow)">
    <rect x="485" y="1020" width="690" height="178" rx="18" fill="#1d2533" stroke="#fb7185" stroke-width="2"/>
  </g>
  <circle cx="520" cy="1054" r="20" fill="#fb7185"/>
  <text x="520" y="1055" class="sans stepNo">5</text>
  <text x="552" y="1060" class="sans cardTitle">Execute the command on the main thread</text>
  <text x="520" y="1097" class="sans body"><tspan class="mono">c→running_tid = MAIN</tspan></text>
  <text x="520" y="1127" class="sans body"><tspan class="mono">processPendingCommandAndInputBuffer</tspan> →</text>
  <text x="520" y="1157" class="sans body"><tspan class="mono">processCommandAndResetClient</tspan> → <tspan class="mono">processCommand</tspan></text>
  <text x="520" y="1183" class="mono code">iothread.c:634–670 · networking.c:3555–3604 · server.c:4459–4467</text>

  <rect x="520" y="1218" width="620" height="70" rx="14" fill="#302418" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="548" y="1247" class="sans body">The command builds the reply in the client’s output buffers.</text>
  <text x="548" y="1273" class="sans small">No socket write is performed by this normal handoff path.</text>

  <!-- Main to IO return -->
  <line x1="1140" y1="1326" x2="1310" y2="1326" stroke="#c084fc" stroke-width="5" marker-end="url(#arrowPurple)"/>
  <text x="1224" y="1303" class="sans arrowLabel">client* + reply buffers</text>
  <text x="1224" y="1351" class="mono" font-size="13" fill="#a78bfa" text-anchor="middle">main pending → t pending</text>
  <g filter="url(#shadow)">
    <rect x="520" y="1303" width="620" height="82" rx="18" fill="#221b31" stroke="#a855f7" stroke-width="2"/>
  </g>
  <circle cx="555" cy="1344" r="20" fill="#c084fc"/>
  <text x="555" y="1345" class="sans stepNo">6</text>
  <text x="588" y="1338" class="sans cardTitle">Return the client to its I/O owner</text>
  <text x="588" y="1368" class="mono code">iothread.c:694–712, 565–590</text>

  <!-- write -->
  <g filter="url(#shadow)">
    <rect x="1310" y="1303" width="775" height="155" rx="18" fill="#12283a" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <circle cx="1346" cy="1338" r="20" fill="#22d3ee"/>
  <text x="1346" y="1339" class="sans stepNo">7</text>
  <text x="1378" y="1344" class="sans cardTitle">Write the reply from the I/O thread</text>
  <text x="1346" y="1380" class="sans body">Re-enable I/O; <tspan class="mono">writeToClient(c, 0)</tspan> immediately.</text>
  <text x="1346" y="1410" class="sans body">If partial: install <tspan class="mono">sendReplyToClient</tspan> for writable events.</text>
  <text x="1346" y="1439" class="mono code">iothread.c:754–839 · networking.c:2839–2952</text>

  <line x1="1310" y1="1494" x2="250" y2="1494" stroke="#34d399" stroke-width="5" marker-end="url(#arrowGreen)"/>
  <rect x="611" y="1465" width="350" height="38" rx="19" fill="#0b3a33" stroke="#34d399"/>
  <text x="786" y="1491" class="sans networkLabel">RESP reply bytes</text>

  <!-- handoff invariant -->
  <rect x="90" y="884" width="290" height="284" rx="18" fill="#151c2b" stroke="#7c5aa4" stroke-width="1.5"/>
  <text x="116" y="922" class="sans cardTitle" font-size="20">What “handoff” means</text>
  <text x="116" y="958" class="sans body" font-size="16">• The same <tspan class="mono">client*</tspan> moves</text>
  <text x="132" y="984" class="sans body" font-size="16">between per-thread lists.</text>
  <text x="116" y="1022" class="sans body" font-size="16">• Mutex protects list transfer;</text>
  <text x="132" y="1048" class="sans body" font-size="16">event notifier wakes peer loop.</text>
  <text x="116" y="1086" class="sans body" font-size="16">• Read/write flags are off while</text>
  <text x="132" y="1112" class="sans body" font-size="16">main executes, preventing races.</text>
  <text x="116" y="1146" class="mono code">iothread.c:23–48, 125–137,</text>
  <text x="116" y="1167" class="mono code">603–640, 777–816</text>

  <!-- footer -->
  <line x1="85" y1="1590" x2="2115" y2="1590" stroke="#2a3b54" stroke-width="2"/>
  <text x="85" y="1623" class="sans footer"><tspan fill="#c4b5fd" font-weight="700">Scope:</tspan> normal client eligible for I/O-thread ownership. Pub/Sub, blocked, tracking, and other special states can be kept on main.</text>
  <text x="85" y="1651" class="mono footer">Eligibility / fallback: iothread.c:281–329, 683–687 · Event dispatch: ae.c:401–449 · Source: PINNED.txt</text>
  <rect x="1870" y="1610" width="245" height="45" rx="22" fill="#18283d" stroke="#35506f"/>
  <text x="1992" y="1638" class="sans" font-size="15" font-weight="700" fill="#bdd0e6" text-anchor="middle">READ → EXECUTE → WRITE</text>
</svg>
